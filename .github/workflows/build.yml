name: CI
permissions:
  contents: read
  pull-requests: write
on:
  push:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  backend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 21 for x64
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin
          architecture: x64
          cache: maven
      - name: Create Maven settings with fallback repositories
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml << 'EOF'
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                    xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0
                    https://maven.apache.org/xsd/settings-1.0.0.xsd">
            <profiles>
              <profile>
                <id>fallback-repos</id>
                <repositories>
                  <repository>
                    <id>central</id>
                    <url>https://repo.maven.apache.org/maven2</url>
                    <releases><enabled>true</enabled></releases>
                  </repository>
                  <repository>
                    <id>google-maven-central</id>
                    <url>https://maven-central.storage-download.googleapis.com/maven2/</url>
                    <releases><enabled>true</enabled></releases>
                  </repository>
                </repositories>
                <pluginRepositories>
                  <pluginRepository>
                    <id>central</id>
                    <url>https://repo.maven.apache.org/maven2</url>
                    <releases><enabled>true</enabled></releases>
                  </pluginRepository>
                  <pluginRepository>
                    <id>google-maven-central</id>
                    <url>https://maven-central.storage-download.googleapis.com/maven2/</url>
                    <releases><enabled>true</enabled></releases>
                  </pluginRepository>
                </pluginRepositories>
              </profile>
            </profiles>
            <activeProfiles>
              <activeProfile>fallback-repos</activeProfile>
            </activeProfiles>
          </settings>
          EOF
      - name: Build with Maven (with retry)
        run: |
          # Retry logic for transient Maven Central issues
          for i in {1..3}; do
            echo "Build attempt $i of 3..."
            if mvn --batch-mode compile; then
              echo "Build successful!"
              exit 0
            fi
            if [ $i -lt 3 ]; then
              echo "Build failed, waiting 10 seconds before retry..."
              sleep 10
            fi
          done
          echo "Build failed after 3 attempts"
          exit 1
        working-directory: ./backend
      # ResultListServiceTest reads the media path through Dotenv, so it needs a .env next to the POM;
      # the images of its layout are test resources
      - name: Run backend tests
        run: |
          echo "RESULTER_MEDIA_FILE_PATH=src/test/resources/certificate/" > .env
          mvn --batch-mode test
        working-directory: ./backend

  docs-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'
      - name: Documentation parity (English and German)
        run: node scripts/docs-parity.mjs
      - name: Tests of the parity check
        run: node --test scripts/

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan history for secrets
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks detect --no-banner --redact --verbose --log-opts=HEAD

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          architecture: x64
          cache: pnpm
          cache-dependency-path: ./frontend/pnpm-lock.yaml
      - name : Use Latest Corepack
        run : |
              echo "Before: corepack version => $(corepack --version || echo 'not installed')"
              npm install -g corepack@latest
              echo "After : corepack version => $(corepack --version)"
              corepack enable
              pnpm --version
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --trust-lockfile
        working-directory: ./frontend
      - name: Build frontend
        run: pnpm build
        working-directory: ./frontend
      - name: Run frontend unit tests
        run: pnpm test:unit
        working-directory: ./frontend
